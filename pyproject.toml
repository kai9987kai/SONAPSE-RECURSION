[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonapse-recursion"
version = "0.1.0"
description = "CPU laboratory for autonomous neural emulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
sonapse-recursion = "sonapse_recursion.__main__:main"

[tool.setuptools]
packages = ["sonapse_recursion"]
